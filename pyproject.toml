[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "solvemycase"
version = "0.1.0"
description = "AI-powered Indian legal procedural roadmaps and grounded statutory/precedent retrieval engine"
authors = [
    { name = "solvemycase Team" }
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "openai>=1.50.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
    "qdrant-client>=1.11.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=2.7.0",
    "duckdb>=1.0.0",
    "pyarrow>=14.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "streamlit>=1.64.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "tqdm>=4.66.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
